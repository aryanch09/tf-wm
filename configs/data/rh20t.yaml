name: rh20t

# Download: https://rh20t.github.io/ (registration required, ~5 TB total)
# Extract episode folders to data/external/rh20t/
root: data/external/rh20t
split_json: data/external/rh20t/splits.json   # auto-generated by download script
split: train

seq_length: 50        # sliding window length
stride: 10
max_force_n: 20.0     # F/T saturation for normalisation (Newtons)
d_proprio: 12

# Use a task subset to avoid downloading all 110 k episodes
# null = use all tasks
task_filter: null

batch_size: 64
num_workers: 4
pin_memory: true

# Phase 5 sim-to-real: cap real data per H-C (≤500 episodes)
max_real_episodes: 500
