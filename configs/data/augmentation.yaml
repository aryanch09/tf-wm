name: augmentation

tactile:
  noise_std: 0.02
  dropout_prob: 0.05
  time_shift_max: 3        # timesteps
  amplitude_scale_range: [0.8, 1.2]
  invert_prob: 0.0

vision:
  random_crop: true
  crop_scale: [0.8, 1.0]
  color_jitter: 0.3
  horizontal_flip: false
  gaussian_blur_sigma: [0.1, 2.0]
  random_erasing_prob: 0.2

proprio:
  noise_std: 0.005
  dropout_prob: 0.0
