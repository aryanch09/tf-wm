site_name: TF-WM Documentation
site_description: Tactile-First World Models for In-Hand and Occluded Manipulation
site_author: TF-WM Contributors
site_url: https://tf-wm.github.io/tfwm/

repo_url: https://github.com/tf-wm/tfwm
repo_name: tf-wm/tfwm
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 TF-WM Contributors

theme:
  name: material
  palette:
    primary: blue
    accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Data Pipeline: data_pipeline.md
  - Training Recipes: training_recipes.md
  - Benchmarks: benchmarks.md
  - Evaluation Protocol: eval_protocol.md
  - Deployment: deployment.md
  - Reproducibility: reproducibility.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - admonition
  - toc:
      permalink: true
  - meta
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
